<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PONCHO DIGITAL - Solicitud de Artesano</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="Estilo_general.css">
    <link rel="stylesheet" href="Estilo_formulario.css">
  </head>
<body>
  <header>
    <nav>
      <a href="Portada.html">Volver Inicio</a>
    </nav>
  </header>
  <main class="container">
  <article>

  <h1>Solicitud de participación</h1>
  <h2>Registro de artesano</h2>
  <p>
  Completá el siguiente formulario para solicitar tu participación
  en la Fiesta Nacional e Internacional del Poncho.
  </p>

  <form action="#" method="post">
  <fieldset>
  <legend>Datos personales</legend>
    <ul>
      <li>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required maxlength="50">
      </li>
      <li>
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" required maxlength="50">
      </li>
      <li>
        <label for="documento">DNI:</label>
        <input type="text" id="documento" name="documento" required inputmode="numeric" maxlength="8">
      </li>
      <li>
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required maxlength="100">
      </li>
      <li>
        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required maxlength="20">
      </li>
      <li>
        <label for="localidad">Localidad:</label>
        <input type="text" id="localidad" name="localidad" required maxlength="60">
      </li>
      <li>
        <label for="provincia">Provincia:</label>
        <select id="provincia" name="provincia" required>
          <option value="">Seleccioná una provincia</option>
          <option value="catamarca">Catamarca</option>
          <option value="buenos-aires">Buenos Aires</option>
          <option value="cordoba">Córdoba</option>
          <option value="jujuy">Jujuy</option>
          <option value="la-rioja">La Rioja</option>
          <option value="mendoza">Mendoza</option>
          <option value="salta">Salta</option>
          <option value="santa-fe">Santa Fe</option>
          <option value="tucuman">Tucumán</option>
          <option value="otra">Otra</option>
        </select>
      </li>
    </ul>
  </fieldset>
  <br>
  <fieldset>
  <legend>Datos del emprendimiento</legend>
    <ul>
      <li>
        <label for="emprendimiento">Nombre del emprendimiento:</label>
        <input type="text" id="emprendimiento" name="emprendimiento" required maxlength="100">
      </li>
      <li>
        <label for="rubro">Rubro:</label>
        <select id="rubro" name="rubro" required>
          <option value="">Seleccioná un rubro</option>
          <option value="textil">Textil</option>
          <option value="artesania">Artesanía</option>
          <option value="productos-regionales">Productos regionales</option>
          <option value="cuero">Cuero</option>
          <option value="madera">Madera</option>
          <option value="ceramica">Cerámica</option>
          <option value="otro">Otro</option>
        </select>
      </li>
    </ul>
    <ul>
      <li>
        <label for="descripcion">Descripción del emprendimiento:</label>
        <textarea id="descripcion" name="descripcion" rows="5" cols="40" required maxlength="500" placeholder="Describí brevemente tu emprendimiento y productos."></textarea>
      </li>
      <li>
        <label for="experiencia">Trayectoria o experiencia:</label>
        <textarea id="experiencia" name="experiencia" rows="5" cols="40" required maxlength="500" placeholder="Contanos sobre tu experiencia como artesano."></textarea>
      </li>
    </ul>
    <ul>
      <li>
        <label for="observaciones">Observaciones:</label>
        <textarea id="observaciones" name="observaciones" rows="4" cols="40" maxlength="300" placeholder="Información adicional."></textarea>
      </li>
      <li>
        <label for="cantidad_productos">Cantidad aproximada de productos a exhibir:</label>
        <input type="number" id="cantidad_productos" name="cantidad_productos" min="1" max="100" required>
      </li>
    </ul>
  </fieldset>

  <div>
    <label for="aceptacion">
      Declaro que los datos ingresados son verdaderos y acepto
      las condiciones de participación.
    </label>
    <input type="checkbox" id="aceptacion" name="aceptacion" required>
  </div>

  <p>
  <button type="submit">Enviar solicitud</button>
  <button type="reset">Limpiar formulario</button>
  </p>
  </form>
  </article>
  </main>
  <footer>
    <div class="container">
      <ul>
        <li>
          <a href="Portada.html">Home</a>
        </li>
      </ul>
      <hr>
      <p>© 2026 Poncho Digital</p>
    </div>
  </footer>
</body>
</html>
